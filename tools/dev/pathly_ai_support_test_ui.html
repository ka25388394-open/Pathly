<!--
DEV ONLY: Pathly AI Support API test UI.
This file is for local development/testing only.
It connects to http://127.0.0.1:8007/api/v1/ai/support.
It intentionally displays raw JSON, metadata, session_id, and tst_marker for debugging.
Do not use this as production frontend.
-->
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>pathly - 陪你慢慢整理內心的角落</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin: 0;
            color: #2d3748;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .header p {
            color: #718096;
            margin: 10px 0;
            font-size: 1.1rem;
        }

        .chat-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        #userInput {
            flex: 1;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 15px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
        }

        #userInput:focus {
            border-color: #667eea;
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        #sendButton {
            padding: 15px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            min-width: 80px;
        }

        #sendButton:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        #sendButton:disabled {
            background: #a0aec0;
            cursor: not-allowed;
        }

        .response {
            background: #f8fafc;
            border-radius: 15px;
            padding: 25px;
            margin: 20px 0;
            border-left: 4px solid #667eea;
            white-space: pre-line;
            line-height: 1.6;
            color: #2d3748;
        }

        .loading {
            text-align: center;
            color: #718096;
            font-style: italic;
            padding: 20px;
        }

        .error {
            background: #fed7d7;
            color: #c53030;
            border-left-color: #f56565;
        }

        .suggestions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin: 30px 0;
        }

        .suggestion {
            background: rgba(255,255,255,0.8);
            border: 2px solid #e2e8f0;
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .suggestion:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
            background: white;
        }

        .suggestion h3 {
            margin: 0 0 10px 0;
            color: #2d3748;
            font-size: 1.1rem;
        }

        .suggestion p {
            margin: 0;
            color: #718096;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>pathly</h1>
        <p>陪你慢慢整理內心的角落</p>
    </div>

    <div class="chat-container">
        <div class="suggestions" id="suggestions">
            <div class="suggestion" onclick="setSuggestion('今天心情不太好，想找人聊聊')">
                <h3>💭 想找人聊聊</h3>
                <p>像朋友一樣陪你慢慢說</p>
            </div>
            <div class="suggestion" onclick="setSuggestion('不知道怎麼開始說我今天的感受')">
                <h3>😊 今天的心情</h3>
                <p>不知道怎麼開始也沒關係</p>
            </div>
            <div class="suggestion" onclick="setSuggestion('有件事情讓我很困擾，想整理一下')">
                <h3>🤔 有事想理一理</h3>
                <p>最近讓你有感覺的事</p>
            </div>
            <div class="suggestion" onclick="setSuggestion('想試著讓自己往前一點點')">
                <h3>🌱 想往前一點點</h3>
                <p>小小的改變也很棒</p>
            </div>
        </div>

        <div class="input-group">
            <input type="text"
                   id="userInput"
                   placeholder="想說什麼就慢慢說吧..."
                   onkeypress="if(event.key==='Enter') sendMessage()">
            <button id="sendButton" onclick="sendMessage()">說</button>
        </div>

        <div id="response"></div>
    </div>

    <script>
        function setSuggestion(text) {
            document.getElementById('userInput').value = text;
            document.getElementById('suggestions').style.display = 'none';
            document.getElementById('userInput').focus();
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const button = document.getElementById('sendButton');
            const responseDiv = document.getElementById('response');

            const message = input.value.trim();
            if (!message) return;

            // 禁用輸入
            button.disabled = true;
            button.textContent = '...';
            input.disabled = true;

            // 顯示載入中
            responseDiv.innerHTML = '<div class="loading">pathly 正在細心聆聽與整理...</div>';

            // 產生或取得 session_id
            let sessionId = sessionStorage.getItem('pathly_session_id');
            if (!sessionId) {
                sessionId = 'sess_' + Date.now() + '_' + Math.random().toString(36).slice(2);
                sessionStorage.setItem('pathly_session_id', sessionId);
            }

            try {
                // 修改1: 改為本地端口8006 + ai/support端點
                const response = await fetch('http://localhost:8007/api/v1/ai/support', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message,
                        session_id: sessionId
                    })
                });

                if (response.ok) {
                    const data = await response.json();

                    // 修改3: 顯示原始JSON回應，方便測試
                    let responseHtml = '<div class="response">';
                    responseHtml += '<h4>✅ API 回應成功</h4>';
                    responseHtml += '<div style="background:#f5f5f5; padding:15px; border-radius:8px; margin:10px 0; font-family:monospace; font-size:12px; white-space:pre-wrap; overflow-x:auto;">';
                    responseHtml += JSON.stringify(data, null, 2);
                    responseHtml += '</div>';

                    // 如果有處理過的回應，也顯示
                    if (data.success && data.data && data.data.response && data.data.response.message) {
                        responseHtml += '<h4>📝 處理後的回應:</h4>';
                        responseHtml += '<div style="background:#e3f2fd; padding:15px; border-radius:8px; margin:10px 0;">';
                        responseHtml += '<strong>Level ' + data.data.level + ':</strong> ' + data.data.response.message;

                        if (data.data.response.suggestions && data.data.response.suggestions.length > 0) {
                            responseHtml += '<br><br><strong>建議：</strong><ul>';
                            data.data.response.suggestions.forEach(suggestion => {
                                responseHtml += '<li>' + suggestion + '</li>';
                            });
                            responseHtml += '</ul>';
                        }
                        responseHtml += '</div>';
                    }

                    responseHtml += '</div>';
                    responseDiv.innerHTML = responseHtml;

                    // 清空輸入框
                    input.value = '';
                } else {
                    throw new Error('HTTP ' + response.status + ': ' + response.statusText);
                }
            } catch (error) {
                // 修改4: 改進錯誤處理
                responseDiv.innerHTML = '<div class="response error">' +
                    '<h4>❌ 連接失敗</h4>' +
                    '<p><strong>錯誤：</strong>' + error.message + '</p>' +
                    '<p><strong>檢查項目：</strong></p>' +
                    '<ul>' +
                    '<li>後端服務是否在 localhost:8007 運行？</li>' +
                    '<li>端點 /api/v1/ai/support 是否正確？</li>' +
                    '<li>CORS 設定是否允許？</li>' +
                    '</ul>' +
                    '</div>';
            }

            // 重新啟用輸入
            button.disabled = false;
            button.textContent = '說';
            input.disabled = false;
            input.focus();
        }

        // 頁面載入時聚焦輸入框
        window.onload = function() {
            document.getElementById('userInput').focus();
        };
    </script>
</body>
</html>
